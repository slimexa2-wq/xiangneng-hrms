name: Diagnose reimbursement patch conflict

on:
  push:
    branches:
      - agent/public-demo-20260727
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check first patch against current branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 198f75a2897f10736792f252274f09d55dd0e8367f11f7478274702e72c92b0e
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch agent/public-demo-20260727 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          comments = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={page}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'xiangneng-patch-conflict-diagnostic'
                  }
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          marker = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
          parts = {}
          for comment in comments:
              lines = (comment.get('body') or '').splitlines()
              if not lines:
                  continue
              match = marker.fullmatch(lines[0].strip())
              if not match:
                  continue
              part = int(match.group(1))
              if part in parts:
                  raise SystemExit(f'duplicate marker {part:02d}')
              parts[part] = ''.join(lines[1:]).strip()
          if sorted(parts) != list(range(1, 13)):
              raise SystemExit(f'found marker parts {sorted(parts)}')
          archive = base64.b64decode(''.join(parts[i] for i in range(1, 13)), validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'sha mismatch {actual}')
          open('/tmp/upgrade.tar.xz', 'wb').write(archive)
          print(f'MARKER_OK bytes={len(archive)} sha256={actual}')
          PY
          rm -rf /tmp/patches && mkdir -p /tmp/patches
          tar -xJf /tmp/upgrade.tar.xz -C /tmp/patches
          patch_file=$(find /tmp/patches -maxdepth 1 -type f -name '*小程序报销与岗位职级权限优化-20260727.patch' -print -quit)
          echo "PATCH_FILE=$(basename "$patch_file")"
          set +e
          git apply --check --verbose "$patch_file" > /tmp/apply.out 2>&1
          status=$?
          set -e
          cat /tmp/apply.out
          echo "APPLY_STATUS=$status"
          exit "$status"
