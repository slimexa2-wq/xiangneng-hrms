name: Apply HRMS V6 upload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v6-upload.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V6 branch
        uses: actions/checkout@v4
        with:
          ref: codex/miniapp-complete-v6
          fetch-depth: 0

      - name: Rebuild and verify source delta
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          (async () => {
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const url = `https://api.github.com/repos/${owner}/${repo}/issues/5/comments?per_page=100`;
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
            const comments = await response.json();
            const chunks = comments
              .map((item) => String(item.body || '').trim())
              .filter((body) => body.length > 1000 && /^[A-Za-z0-9+/=]+$/.test(body));
            if (chunks.length !== 9) throw new Error(`Expected 9 payload chunks, received ${chunks.length}`);
            const archive = Buffer.from(chunks.join(''), 'base64');
            const digest = crypto.createHash('sha256').update(archive).digest('hex');
            const expected = 'f823a0650a3656bf7a7e07971385a78fb04ede37e60ec45c6115d5552d8ae032';
            if (digest !== expected) throw new Error(`Payload SHA-256 mismatch: ${digest}`);
            fs.writeFileSync('/tmp/v6delta.tar.xz', archive);
            console.log(`Verified ${chunks.length} chunks, ${archive.length} bytes, SHA-256 ${digest}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          tar -xJf /tmp/v6delta.tar.xz -C .
          if [ -s V6_DELETED_FILES.txt ]; then
            while IFS= read -r file; do
              [ -z "$file" ] || rm -rf -- "$file"
            done < V6_DELETED_FILES.txt
          fi
          rm -f V6_DELETED_FILES.txt

      - name: Commit and push V6 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes detected.'
          else
            git commit -m 'feat: upload HRMS miniapp complete V6'
          fi
          git push origin HEAD:codex/miniapp-complete-v6

      - name: Create pull request and close upload issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh pr view codex/miniapp-complete-v6 --json url >/tmp/v6-pr.json 2>/dev/null; then
            gh pr create \
              --base main \
              --head codex/miniapp-complete-v6 \
              --title 'feat: HRMS 小程序完善与全端联动 V6.0' \
              --body $'## 内容\n\n- 完整 HRMS 工作区源码\n- 求职者、员工、供应商、内部人员四端小程序\n- Fastify API、Prisma 模型与迁移、管理后台配套修改\n- 小程序 UI、权限、报销、结算、借支、申诉及附件闭环\n\n## 本地验证\n\n- 小程序契约测试 64/64\n- 项目工具测试 69/69\n- 架构检查 15 个模块通过\n\n未上传 `.env`、数据库备份、密钥、node_modules 或构建缓存。'
          fi
          PR_URL=$(gh pr view codex/miniapp-complete-v6 --json url --jq .url)
          gh issue close 5 --comment "V6 源码已上传并创建 PR：${PR_URL}"
          echo "PR_URL=${PR_URL}"
