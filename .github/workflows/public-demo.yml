name: Build public demo

on:
  push:
    branches:
      - agent/public-demo-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiangneng-public-demo
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated synthetic-data demo
        id: build
        continue-on-error: true
        env:
          PUBLIC_DEMO_ROOT: ./
          PUBLIC_DEMO_ROUTER_MODE: hash
        run: |
          set +e
          pnpm build:public-demo > public-demo-build.log 2>&1
          status=$?
          cat public-demo-build.log
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish failed build log
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/xiangneng-public-demo-debug
          cp public-demo-build.log /tmp/xiangneng-public-demo-debug/BUILD_LOG.txt
          cd /tmp/xiangneng-public-demo-debug
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo-debug
          git add BUILD_LOG.txt
          git commit -m "debug: public demo build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo-debug

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Add static hosting metadata
        run: |
          touch apps/sites-demo/dist/client/.nojekyll
          cp apps/sites-demo/dist/client/index.html apps/sites-demo/dist/client/404.html
          cat > apps/sites-demo/dist/client/deployment-info.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "dataMode": "synthetic-offline-demo"
          }
          JSON

      - name: Publish public-demo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/sites-demo/dist/client
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo
          git add -A
          git commit -m "deploy: public demo ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo
