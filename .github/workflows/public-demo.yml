name: Build public demo

on:
  push:
    branches:
      - agent/public-demo-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: xiangneng-public-demo-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Collect all marker comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/xiangneng-upgrade-patches /tmp/xiangneng-upgrade-bundle.tar.xz /tmp/xiangneng-upgrade-bundle.b64
          mkdir -p /tmp/xiangneng-upgrade-patches
          python - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          comments = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={page}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'xiangneng-public-demo-builder'
                  }
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          marker = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
          parts = {}
          for comment in comments:
              lines = (comment.get('body') or '').splitlines()
              if not lines:
                  continue
              match = marker.fullmatch(lines[0].strip())
              if not match:
                  continue
              part = int(match.group(1))
              if part in parts:
                  raise SystemExit(f'duplicate marker part {part:02d}')
              payload = ''.join(lines[1:]).strip()
              if not re.fullmatch(r'[A-Za-z0-9+/=]+', payload):
                  raise SystemExit(f'part {part:02d} contains invalid base64 characters')
              parts[part] = payload

          expected = list(range(1, 13))
          if sorted(parts) != expected:
              raise SystemExit(f'parts mismatch: found={sorted(parts)} expected={expected}; comments={len(comments)} pages={page}')
          for part in range(1, 12):
              if len(parts[part]) != 15000:
                  raise SystemExit(f'part {part:02d} length={len(parts[part])} expected=15000')
          if len(parts[12]) != 13832:
              raise SystemExit(f'part 12 length={len(parts[12])} expected=13832')

          joined = ''.join(parts[part] for part in expected)
          with open('/tmp/xiangneng-upgrade-bundle.b64', 'w') as handle:
              handle.write(joined)
          print(f'Collected marker bundle: comments={len(comments)} pages={page} parts=12 base64={len(joined)}')
          PY

      - name: Decode and verify marker bundle
        env:
          EXPECTED_SHA256: 198f75a2897f10736792f252274f09d55dd0e8367f11f7478274702e72c92b0e
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os
          encoded = open('/tmp/xiangneng-upgrade-bundle.b64').read()
          archive = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(archive).hexdigest()
          if actual_sha != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'sha256 mismatch: actual={actual_sha} expected={os.environ["EXPECTED_SHA256"]}')
          with open('/tmp/xiangneng-upgrade-bundle.tar.xz', 'wb') as handle:
              handle.write(archive)
          print(f'Validated marker bundle: bytes={len(archive)} sha256={actual_sha}')
          PY

      - name: Extract and normalize verified upgrade bundle
        run: |
          set -euo pipefail
          tar -tJf /tmp/xiangneng-upgrade-bundle.tar.xz
          tar -xJf /tmp/xiangneng-upgrade-bundle.tar.xz -C /tmp/xiangneng-upgrade-patches
          patch_count=$(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name '*.patch' | wc -l)
          echo "Extracted patch count: ${patch_count}"
          test "${patch_count}" -eq 3
          while IFS= read -r -d '' patch_file; do
            echo "Normalizing patch line endings: $(basename "$patch_file")"
            sed -i 's/\r$//' "$patch_file"
          done < <(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name '*.patch' -print0)

      - name: Apply reimbursement and role patch
        run: |
          set -euo pipefail
          patch_file=$(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name '*小程序报销与岗位职级权限优化-20260727.patch' -print -quit)
          test -n "$patch_file"
          echo "Applying $(basename "$patch_file")"
          git apply --check --verbose "$patch_file"
          git apply --whitespace=nowarn "$patch_file"

      - name: Apply internal organization correction patch
        run: |
          set -euo pipefail
          patch_file=$(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name '*内部组织按业务部门修正版-20260727.patch' -print -quit)
          test -n "$patch_file"
          echo "Applying $(basename "$patch_file")"
          git apply --check --verbose "$patch_file"
          git apply --whitespace=nowarn "$patch_file"

      - name: Apply AI maintainability patch
        run: |
          set -euo pipefail
          patch_file=$(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name '*AI模块化维护基础优化-20260727.patch' -print -quit)
          test -n "$patch_file"
          echo "Applying $(basename "$patch_file")"
          git apply --check --verbose "$patch_file"
          git apply --whitespace=nowarn "$patch_file"

      - name: Normalize and verify upgraded source
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              *.ts|*.tsx|*.js|*.mjs|*.cjs|*.json|*.md|*.prisma|*.sql|*.yml|*.yaml|*.css|*.scss|*.sass|*.less|*.html|*.txt)
                sed -i 's/\r$//' "$file"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACM -z)
          git diff --check
          node scripts/generate-project-index.mjs
          node scripts/check-architecture.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated synthetic-data demo
        env:
          PUBLIC_DEMO_ROOT: ./
          PUBLIC_DEMO_ROUTER_MODE: hash
        run: pnpm build:public-demo

      - name: Add static hosting metadata
        run: |
          touch apps/sites-demo/dist/client/.nojekyll
          cp apps/sites-demo/dist/client/index.html apps/sites-demo/dist/client/404.html
          cat > apps/sites-demo/dist/client/deployment-info.json <<JSON
          {
            "sourceCommit": "${SOURCE_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "dataMode": "synthetic-offline-demo"
          }
          JSON

      - name: Publish public-demo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/sites-demo/dist/client
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo
          git add -A
          git commit -m "deploy: public demo ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo

      - name: Verify public demo URLs
        run: |
          verify_url() {
            url="$1"
            for attempt in $(seq 1 18); do
              echo "Checking ${url} (attempt ${attempt}/18)"
              if curl --fail --silent --show-error --location --max-time 30 "$url" > /tmp/public-demo-page.html \
                && grep -q "祥能" /tmp/public-demo-page.html; then
                echo "Verified ${url}"
                return 0
              fi
              sleep 10
            done
            echo "Public demo URL did not become healthy: ${url}" >&2
            return 1
          }
          verify_url "https://raw.githack.com/slimexa2-wq/xiangneng-hrms/public-demo/index.html"
          verify_url "https://raw.githack.com/slimexa2-wq/xiangneng-hrms/public-demo/portal/index.html"
