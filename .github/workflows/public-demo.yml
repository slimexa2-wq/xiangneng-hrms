name: Build public demo

on:
  push:
    branches:
      - agent/public-demo-20260727
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: xiangneng-public-demo-push
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upgrade source to latest verified baseline
        id: upgrade
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 198f75a2897f10736792f252274f09d55dd0e8367f11f7478274702e72c92b0e
        run: |
          set +e
          {
            set -euo pipefail
            rm -rf /tmp/xiangneng-upgrade-patches /tmp/xiangneng-upgrade-bundle.tar.xz
            mkdir -p /tmp/xiangneng-upgrade-patches

            python - <<'PY'
            import base64, hashlib, json, os, re, urllib.request

            repo = os.environ['GITHUB_REPOSITORY']
            token = os.environ['GH_TOKEN']
            expected_sha = os.environ['EXPECTED_SHA256']
            request = urllib.request.Request(
                f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100',
                headers={
                    'Authorization': f'Bearer {token}',
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'xiangneng-public-demo-builder'
                }
            )
            with urllib.request.urlopen(request) as response:
                comments = json.load(response)

            marker = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
            found = {}
            for comment in comments:
                lines = (comment.get('body') or '').splitlines()
                if not lines:
                    continue
                match = marker.fullmatch(lines[0].strip())
                if not match:
                    continue
                part = int(match.group(1))
                payload = ''.join(lines[1:]).strip()
                if not re.fullmatch(r'[A-Za-z0-9+/=]+', payload):
                    raise SystemExit(f'part {part:02d} contains invalid base64 characters')
                if part in found:
                    raise SystemExit(f'duplicate marker part {part:02d}')
                found[part] = payload

            expected_parts = list(range(1, 13))
            if sorted(found) != expected_parts:
                raise SystemExit(f'parts mismatch: found={sorted(found)} expected={expected_parts}')
            for part in range(1, 12):
                if len(found[part]) != 15000:
                    raise SystemExit(f'part {part:02d} length={len(found[part])} expected=15000')
            if len(found[12]) != 13832:
                raise SystemExit(f'part 12 length={len(found[12])} expected=13832')

            archive = base64.b64decode(''.join(found[part] for part in expected_parts), validate=True)
            actual_sha = hashlib.sha256(archive).hexdigest()
            if actual_sha != expected_sha:
                raise SystemExit(f'sha256 mismatch: actual={actual_sha} expected={expected_sha}')
            with open('/tmp/xiangneng-upgrade-bundle.tar.xz', 'wb') as handle:
                handle.write(archive)
            print(f'Validated marker bundle: {len(archive)} bytes, sha256={actual_sha}')
            PY

            tar -tJf /tmp/xiangneng-upgrade-bundle.tar.xz
            tar -xJf /tmp/xiangneng-upgrade-bundle.tar.xz -C /tmp/xiangneng-upgrade-patches

            apply_patch() {
              pattern="$1"
              patch_file=$(find /tmp/xiangneng-upgrade-patches -maxdepth 1 -type f -name "$pattern" -print -quit)
              if [ -z "$patch_file" ]; then
                echo "Missing verified upgrade patch: $pattern" >&2
                return 1
              fi
              echo "Applying $(basename "$patch_file")"
              git apply --check "$patch_file"
              git apply --whitespace=nowarn "$patch_file"
            }

            apply_patch "*小程序报销与岗位职级权限优化-20260727.patch"
            apply_patch "*内部组织按业务部门修正版-20260727.patch"
            apply_patch "*AI模块化维护基础优化-20260727.patch"

            echo "Normalize patched text line endings"
            while IFS= read -r -d '' file; do
              case "$file" in
                *.ts|*.tsx|*.js|*.mjs|*.cjs|*.json|*.md|*.prisma|*.sql|*.yml|*.yaml|*.css|*.scss|*.sass|*.less|*.html|*.txt)
                  sed -i 's/\r$//' "$file"
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACM -z)

            git diff --check
            node scripts/generate-project-index.mjs
            node scripts/check-architecture.mjs
          } > public-demo-upgrade.log 2>&1
          status=$?
          cat public-demo-upgrade.log
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish failed upgrade log
        if: steps.upgrade.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/xiangneng-public-demo-upgrade-debug
          cp public-demo-upgrade.log /tmp/xiangneng-public-demo-upgrade-debug/UPGRADE_LOG.txt
          cd /tmp/xiangneng-public-demo-upgrade-debug
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo-upgrade-debug
          git add UPGRADE_LOG.txt
          git commit -m "debug: public demo upgrade ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo-upgrade-debug

      - name: Stop after failed upgrade
        if: steps.upgrade.outcome == 'failure'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated synthetic-data demo
        id: build
        continue-on-error: true
        env:
          PUBLIC_DEMO_ROOT: ./
          PUBLIC_DEMO_ROUTER_MODE: hash
        run: |
          set +e
          pnpm build:public-demo > public-demo-build.log 2>&1
          status=$?
          cat public-demo-build.log
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish failed build log
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/xiangneng-public-demo-debug
          cp public-demo-build.log /tmp/xiangneng-public-demo-debug/BUILD_LOG.txt
          cd /tmp/xiangneng-public-demo-debug
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo-debug
          git add BUILD_LOG.txt
          git commit -m "debug: public demo build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo-debug

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Add static hosting metadata
        run: |
          touch apps/sites-demo/dist/client/.nojekyll
          cp apps/sites-demo/dist/client/index.html apps/sites-demo/dist/client/404.html
          cat > apps/sites-demo/dist/client/deployment-info.json <<JSON
          {
            "sourceCommit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "dataMode": "synthetic-offline-demo"
          }
          JSON

      - name: Publish public-demo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/sites-demo/dist/client
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b public-demo
          git add -A
          git commit -m "deploy: public demo ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin public-demo

      - name: Verify public demo URLs
        run: |
          verify_url() {
            url="$1"
            for attempt in $(seq 1 18); do
              echo "Checking ${url} (attempt ${attempt}/18)"
              if curl --fail --silent --show-error --location --max-time 30 "$url" > /tmp/public-demo-page.html \
                && grep -q "祥能" /tmp/public-demo-page.html; then
                echo "Verified ${url}"
                return 0
              fi
              sleep 10
            done
            echo "Public demo URL did not become healthy: ${url}" >&2
            return 1
          }

          verify_url "https://raw.githack.com/slimexa2-wq/xiangneng-hrms/public-demo/index.html"
          verify_url "https://raw.githack.com/slimexa2-wq/xiangneng-hrms/public-demo/portal/index.html"
