name: Validate PR marker bundle

on:
  push:
    branches:
      - agent/comment-recovery-20260728
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 198f75a2897f10736792f252274f09d55dd0e8367f11f7478274702e72c92b0e
        run: |
          set -euo pipefail
          rm -rf /tmp/marker-validation
          mkdir -p /tmp/marker-validation/extracted
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected_sha = os.environ['EXPECTED_SHA256']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'xiangneng-marker-validator'
              }
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)

          marker = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
          found = {}
          for comment in comments:
              lines = (comment.get('body') or '').splitlines()
              if not lines:
                  continue
              match = marker.fullmatch(lines[0].strip())
              if not match:
                  continue
              part = int(match.group(1))
              payload = ''.join(lines[1:]).strip()
              if not re.fullmatch(r'[A-Za-z0-9+/=]+', payload):
                  raise SystemExit(f'part {part:02d} contains invalid base64 characters')
              if part in found:
                  raise SystemExit(f'duplicate marker part {part:02d}')
              found[part] = {
                  'payload': payload,
                  'comment_id': comment['id'],
                  'url': comment['html_url']
              }

          expected_parts = list(range(1, 13))
          if sorted(found) != expected_parts:
              raise SystemExit(f'parts mismatch: found={sorted(found)} expected={expected_parts}')
          for part in range(1, 12):
              if len(found[part]['payload']) != 15000:
                  raise SystemExit(f'part {part:02d} length={len(found[part]["payload"])} expected=15000')
          if len(found[12]['payload']) != 13832:
              raise SystemExit(f'part 12 length={len(found[12]["payload"])} expected=13832')

          joined = ''.join(found[part]['payload'] for part in expected_parts)
          archive = base64.b64decode(joined, validate=True)
          actual_sha = hashlib.sha256(archive).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'sha256 mismatch: actual={actual_sha} expected={expected_sha}')

          output = '/tmp/marker-validation'
          with open(f'{output}/upgrade-bundle.tar.xz', 'wb') as handle:
              handle.write(archive)
          manifest = {
              'status': 'validated',
              'partCount': 12,
              'base64Length': len(joined),
              'archiveBytes': len(archive),
              'sha256': actual_sha,
              'parts': {
                  f'{part:02d}': {
                      'length': len(found[part]['payload']),
                      'comment_id': found[part]['comment_id'],
                      'url': found[part]['url']
                  }
                  for part in expected_parts
              }
          }
          with open(f'{output}/manifest.json', 'w') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          tar -tJf /tmp/marker-validation/upgrade-bundle.tar.xz > /tmp/marker-validation/archive-files.txt
          tar -xJf /tmp/marker-validation/upgrade-bundle.tar.xz -C /tmp/marker-validation/extracted
          test "$(find /tmp/marker-validation/extracted -maxdepth 1 -type f -name '*.patch' | wc -l)" -eq 3

      - name: Publish validation evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/marker-validation
          rm -rf extracted upgrade-bundle.tar.xz
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b comment-recovery-output
          git add manifest.json archive-files.txt
          git commit -m "ci: validate PR marker bundle ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin comment-recovery-output
