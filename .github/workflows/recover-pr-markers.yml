name: Recover PR marker chunks

on:
  push:
    branches:
      - agent/comment-recovery-20260728
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover marker comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/marker-output
          mkdir -p /tmp/marker-output/recovered
          python - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'xiangneng-marker-recovery'
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          found = {}
          for comment in comments:
              body = comment.get('body') or ''
              match = re.match(r'^XIANGNENG_PATCH_PART_(\d{2})_12\n([A-Za-z0-9+/=]+)\s*$', body)
              if not match:
                  continue
              part = int(match.group(1))
              if part in found:
                  raise SystemExit(f'duplicate marker part {part:02d}')
              found[part] = {
                  'comment_id': comment['id'],
                  'url': comment['html_url'],
                  'length': len(match.group(2)),
                  'content': match.group(2)
              }
          output = '/tmp/marker-output'
          for part, item in sorted(found.items()):
              with open(f'{output}/recovered/part{part:02d}.txt', 'w') as handle:
                  handle.write(item['content'])
          manifest = {
              'found': sorted(found),
              'missing': [part for part in range(1, 13) if part not in found],
              'parts': {f'{part:02d}': {k: v for k, v in item.items() if k != 'content'} for part, item in sorted(found.items())}
          }
          with open(f'{output}/manifest.json', 'w') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          with open(f'{output}/available.b64', 'w') as handle:
              for part in range(1, 13):
                  if part not in found:
                      break
                  handle.write(found[part]['content'])
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Publish recovery output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/marker-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b comment-recovery-output
          git add -A
          git commit -m "debug: recover PR marker chunks ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin comment-recovery-output
