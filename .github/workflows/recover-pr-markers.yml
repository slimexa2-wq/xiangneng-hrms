name: Diagnose reimbursement patch conflict

on:
  push:
    branches:
      - agent/comment-recovery-20260728
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose first patch against public demo branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: 198f75a2897f10736792f252274f09d55dd0e8367f11f7478274702e72c92b0e
        run: |
          set -euo pipefail
          rm -rf /tmp/patch-diagnostic /tmp/patches repo
          mkdir -p /tmp/patch-diagnostic /tmp/patches
          git clone --quiet --depth=1 --branch agent/public-demo-20260727 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          comments = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100&page={page}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'xiangneng-patch-conflict-diagnostic'
                  }
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              comments.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          marker = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
          parts = {}
          for comment in comments:
              lines = (comment.get('body') or '').splitlines()
              if not lines:
                  continue
              match = marker.fullmatch(lines[0].strip())
              if not match:
                  continue
              part = int(match.group(1))
              if part in parts:
                  raise SystemExit(f'duplicate marker {part:02d}')
              parts[part] = ''.join(lines[1:]).strip()
          if sorted(parts) != list(range(1, 13)):
              raise SystemExit(f'found marker parts {sorted(parts)}')
          archive = base64.b64decode(''.join(parts[i] for i in range(1, 13)), validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'sha mismatch {actual}')
          open('/tmp/upgrade.tar.xz', 'wb').write(archive)
          PY
          tar -xJf /tmp/upgrade.tar.xz -C /tmp/patches
          patch_file=$(find /tmp/patches -maxdepth 1 -type f -name '*小程序报销与岗位职级权限优化-20260727.patch' -print -quit)
          set +e
          git apply --check --verbose "$patch_file" > /tmp/patch-diagnostic/result.txt 2>&1
          status=$?
          set -e
          {
            echo "status=$status"
            echo "branch=agent/public-demo-20260727"
            echo "commit=$(git rev-parse HEAD)"
            echo "patch=$(basename "$patch_file")"
            echo "----- git apply output -----"
            cat /tmp/patch-diagnostic/result.txt
          } > /tmp/patch-diagnostic/final.txt
          cat /tmp/patch-diagnostic/final.txt

      - name: Publish concise diagnostic result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/patch-diagnostic
          cp final.txt PATCH_CONFLICT.txt
          rm -f result.txt final.txt
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b comment-recovery-output
          git add PATCH_CONFLICT.txt
          git commit -m "ci: diagnose reimbursement patch conflict ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin comment-recovery-output
