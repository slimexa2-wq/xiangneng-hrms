name: Recover PR marker chunks

on:
  push:
    branches:
      - agent/comment-recovery-20260728
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover marker comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/marker-output
          mkdir -p /tmp/marker-output/recovered /tmp/marker-output/raw-comments
          python - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/issues/1/comments?per_page=100'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'xiangneng-marker-recovery'
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          output = '/tmp/marker-output'
          found = {}
          inspected = []
          marker_pattern = re.compile(r'^XIANGNENG_PATCH_PART_(\d{2})_12$')
          for comment in comments:
              body = comment.get('body') or ''
              lines = body.splitlines()
              first_line = lines[0].strip() if lines else ''
              marker = marker_pattern.match(first_line)
              if not marker:
                  continue
              part = int(marker.group(1))
              payload = ''.join(lines[1:]).strip()
              valid_chars = bool(re.fullmatch(r'[A-Za-z0-9+/=]*', payload))
              inspected.append({
                  'part': part,
                  'comment_id': comment['id'],
                  'url': comment['html_url'],
                  'body_length': len(body),
                  'line_count': len(lines),
                  'payload_length': len(payload),
                  'valid_base64_chars': valid_chars,
                  'payload_prefix': payload[:40],
                  'payload_suffix': payload[-40:]
              })
              with open(f'{output}/raw-comments/comment-{comment["id"]}-part{part:02d}.txt', 'w') as handle:
                  handle.write(body)
              if valid_chars and part not in found:
                  found[part] = {
                      'comment_id': comment['id'],
                      'url': comment['html_url'],
                      'length': len(payload),
                      'content': payload
                  }
          for part, item in sorted(found.items()):
              with open(f'{output}/recovered/part{part:02d}.txt', 'w') as handle:
                  handle.write(item['content'])
          manifest = {
              'found': sorted(found),
              'missing': [part for part in range(1, 13) if part not in found],
              'parts': {f'{part:02d}': {k: v for k, v in item.items() if k != 'content'} for part, item in sorted(found.items())},
              'inspected': sorted(inspected, key=lambda item: (item['part'], item['comment_id']))
          }
          with open(f'{output}/manifest.json', 'w') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Publish recovery output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/marker-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b comment-recovery-output
          git add -A
          git commit -m "debug: inspect PR marker chunks ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin comment-recovery-output
