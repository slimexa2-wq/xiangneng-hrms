# 祥能 HRMS —— Render Blueprint 部署配置
#
# 单 Web Service 部署：API 进程同时托管门户（portal）静态构建产物，
# 连 Render Postgres addon，release 阶段只跑正式迁移。
# 公开比赛演示使用 Sites 隔离合成数据版本；此 Blueprint 不导入演示账号。

services:
  # ---- 主应用：单个 Web Service ----
  - type: web
    name: xiangneng-hrms
    runtime: node
    # 说明：free 计划会在 15 分钟无流量后休眠（下次访问需冷启动十几秒），比赛/演示请务必用 starter。
    plan: starter
    region: oregon        # 可选：singapore / oregon / frankfurt 等
    branch: main
    # Render 注入 PORT 环境变量，应用已适配（process.env.PORT ?? API_PORT ?? 3310）。
    healthCheckPath: /health
    # 构建：安装依赖 -> 生成 Prisma client -> 构建 api + portal（pnpm build 会递归构建所有包）。
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    # 启动：直接运行编译后的单服务（API 同时 serve 门户静态包）。
    startCommand: node apps/api/dist/server.js
    # release：只执行正式数据库迁移，不导入比赛演示数据或随机密码账号。
    releaseCommand: pnpm db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xiangneng-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false          # 在 Render 后台填写，需 ≥32 字符的随机串
      - key: AI_DEMO_MODE
        value: "false"
      - key: ADMIN_ORIGIN
        value: "*"           # 单服务同源部署，门户与 API 同域；留 "*" 即可
      - key: XIANGNENG_LLM_PROVIDER
        value: "ollama"
      - key: XIANGNENG_LLM_BASE_URL
        sync: false          # 指向受控内网 Ollama，例如 http://ollama.internal:11434/v1
      - key: XIANGNENG_LLM_MODEL
        value: "qwen3.5:4b"
      - key: XIANGNENG_LLM_CHAT_MODEL
        value: "qwen3.5:4b"
      - key: XIANGNENG_LLM_API_KEY
        value: "ollama-local"

  # ---- 数据库：Render Postgres ----
  - type: postgres
    name: xiangneng-db
    plan: starter          # free 仅 256MB，1.7 万人员演示数据偏紧，建议 starter
    databaseName: xiangneng_hrms_demo
    user: xiangneng
    postgresMajorVersion: "16"
